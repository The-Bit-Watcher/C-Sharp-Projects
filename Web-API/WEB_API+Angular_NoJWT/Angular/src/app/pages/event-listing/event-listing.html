<div class="event-list-container">
    <div *ngFor="let event of events" class="list-card-wrapper">
        <mat-card class="list-card" appearance="outlined">
            <mat-card-header>

                <div mat-card-avatar class="game-card-avatar">
                    <mat-card-title>
                        {{event.EventName}}
                    </mat-card-title>
                </div>
            </mat-card-header>

            <mat-card-content>
                <p>Location: {{event.Location}}</p>
                <p>Ticket Price: {{event.TicketPrice}}</p>   
            </mat-card-content>

            <mat-card-actions>
               <button mat-button (click)="navigateToEdit(event.Id)">Edit Event</button>
               <button mat-button (click)="deleteEvent(event.Id, event.EventName)">Delete Event</button>
            </mat-card-actions>

        </mat-card>
    </div>
</div>
