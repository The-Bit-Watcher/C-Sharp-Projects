<div class="edit-event-container">
    <mat-card class="edit-event-card">
        <mat-card-header>
            <mat-card-title>
                Edit Event
            </mat-card-title>
        </mat-card-header>


        <mat-card-content>
            <form #eventForm="ngForm" (ngSubmit)="saveEvent()">
                 <div class="form-field">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Event Name</mat-label>
                            <input matInput [(ngModel)]="currentEvent.EventName"
                            type="string" name = "EventName" required>
                    </mat-form-field>
                 </div>

                 <div class="form-field">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Ticket Price</mat-label>
                            <input matInput type="number" 
                            [(ngModel)]="currentEvent.TicketPrice" name="ticketPrice" required>
                    </mat-form-field>
                </div>

            <div class="form-actions">
                <button mat-button type="button" (click)="cancel()">
                    <mat-icon>cancel</mat-icon>
                    Cancel
                </button>
                <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  [disabled]="!eventForm.valid">
                    <mat-icon>save</mat-icon>
                    Save Changes
                </button>
            </div>

            </form>
        </mat-card-content>
    </mat-card>
</div>
